<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Buzón de Sugerencias — Cafetería</title>
</head>
<body>
  <h1>Buzón de Sugerencias — Cafetería</h1>
  <form id="formulario">
    <input type="text" name="nombre" placeholder="Nombre (opcional)">
    <select name="prioridad">
      <option value="alta">Alta</option>
      <option value="media">Media</option>
      <option value="Baja">Baja</option> 
    <select name="categoria>
      <option value="Comida">Comida</option>
      <option value="Precios">Precios</option>
      <option value="Atención">Atención</option>
      <option value="Higiene">Higiene</option>
    </select>
    <textarea name="mensaje" required placeholder="Escribe tu sugerencia..."></textarea>
    <button type="submit">Enviar</button>
  </form>

  <script src="script.js"></script>
</body>
</html>
